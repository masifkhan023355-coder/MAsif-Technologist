<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M Asif Lab Technician — Learn Laboratory Tests. Understand Diseases.</title>
<meta name="description" content="M Asif Lab Technician — a premium medical laboratory learning platform for MLT students: 150 laboratory tests, reference ranges, diagnostic guides, flashcards, MCQs and mock exams.">
<meta name="theme-color" content="#071426">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23071426'/><path d='M38 22h24M42 22v22L26 78a8 8 0 0 0 7 11h34a8 8 0 0 0 7-11L58 44V22' stroke='%2335C8FF' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --bg:#071426; --bg2:#0B1F3A; --card:#102844; --card2:#0E2340;
  --blue:#1769FF; --cyan:#35C8FF; --text:#F4F7FB; --muted:#A9BCD2;
  --ok:#22C55E; --warn:#FBBF24; --err:#F87171; --border:#233D5C;
  --shadow:0 10px 30px rgba(0,0,0,.35); --radius:16px;
}
[data-theme="light"]{
  --bg:#EEF3FA; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F7FAFF;
  --text:#0B1F3A; --muted:#5A7189; --border:#D5E1EF;
  --shadow:0 10px 26px rgba(11,31,58,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
mark{background:rgba(53,200,255,.28);color:inherit;border-radius:4px;padding:0 2px}
::selection{background:rgba(23,105,255,.45)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1B3A5E;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#26507F}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;z-index:70;
  background:linear-gradient(180deg,#0A1D35 0%,#071426 100%);
  border-right:1px solid var(--border);padding:16px 12px 26px;
  display:flex;flex-direction:column;gap:3px;
}
[data-theme="light"] .sidebar{background:linear-gradient(180deg,#FFFFFF,#F2F7FD)}
.brand{display:flex;gap:11px;align-items:center;padding:8px 10px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}
.brand-mark{
  width:42px;height:42px;border-radius:12px;flex:0 0 42px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 6px 18px rgba(23,105,255,.4);
}
.brand-name{font-weight:800;font-size:15px;letter-spacing:.2px;line-height:1.15}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;margin-top:2px}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:#5F7C9B;font-weight:700;padding:14px 12px 6px}
[data-theme="light"] .nav-sec{color:#8296AD}
.nav-item{
  display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:11px;
  color:var(--muted);font-size:13.6px;font-weight:500;transition:.16s;border:1px solid transparent;
}
.nav-item:hover{background:rgba(23,105,255,.1);color:var(--text);text-decoration:none}
.nav-item.active{
  background:linear-gradient(90deg,rgba(23,105,255,.26),rgba(53,200,255,.07));
  color:#fff;border-color:rgba(53,200,255,.28);box-shadow:inset 0 0 22px rgba(23,105,255,.15)
}
[data-theme="light"] .nav-item.active{color:#0B1F3A}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.92}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:60;display:flex;gap:12px;align-items:center;
  padding:11px 22px;border-bottom:1px solid var(--border);
  background:rgba(7,20,38,.86);backdrop-filter:blur(14px);
}
[data-theme="light"] .topbar{background:rgba(255,255,255,.86)}
.menu-btn{display:none}
.search-wrap{position:relative;flex:1;max-width:640px}
.search-input{
  width:100%;padding:11px 40px 11px 40px;border-radius:12px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:.18s;
}
.search-input::placeholder{color:#6B86A3}
.search-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(53,200,255,.14)}
.search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:#6B86A3;fill:none;stroke-width:1.9;pointer-events:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#7C93AC;cursor:pointer;font-size:17px;padding:4px 7px;border-radius:7px;line-height:1}
.search-clear:hover{background:rgba(255,255,255,.07);color:var(--text)}
.search-pop{
  position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);
  border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
  max-height:60vh;overflow-y:auto;display:none;padding:6px;z-index:80;
}
.search-pop.show{display:block}
.pop-item{display:block;padding:9px 11px;border-radius:10px;color:var(--text);font-size:13.5px}
.pop-item:hover,.pop-item.hl{background:rgba(23,105,255,.16);text-decoration:none}
.pop-item small{display:block;color:var(--muted);font-size:11.8px;margin-top:2px}

.view{padding:26px 26px 60px;max-width:1400px;width:100%;margin:0 auto;flex:1}
.foot{border-top:1px solid var(--border);padding:18px 26px;color:var(--muted);font-size:12.4px;text-align:center}

/* ---------- Components ---------- */
h1{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
h2{font-size:19px;font-weight:750;letter-spacing:-.2px}
h3{font-size:15.5px;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;
  border:1px solid var(--border);background:var(--card2);color:var(--text);
  font-size:13.4px;font-weight:600;font-family:inherit;cursor:pointer;transition:.16s;white-space:nowrap;
}
.btn:hover{background:#17375E;border-color:#2E527D;text-decoration:none}
[data-theme="light"] .btn:hover{background:#E7F0FB}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(23,105,255,.32)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.4px;border-radius:9px}
.btn.ok{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4);color:#7BE8A6}
.btn.warn{background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.38);color:#FFD978}
.btn.danger{background:rgba(248,113,113,.13);border-color:rgba(248,113,113,.38);color:#FFA3A3}
.btn:disabled{opacity:.5;cursor:not-allowed}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--border);background:var(--card2);color:var(--muted);
  font-size:12.6px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;
}
.chip:hover{color:var(--text);border-color:#31608F}
.chip.active{background:linear-gradient(135deg,rgba(23,105,255,.3),rgba(53,200,255,.14));color:#fff;border-color:rgba(53,200,255,.5)}
[data-theme="light"] .chip.active{color:#0B1F3A}

.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.3px;font-weight:700;letter-spacing:.2px}
.b-blue{background:rgba(23,105,255,.18);color:#8FBBFF;border:1px solid rgba(23,105,255,.35)}
.b-cyan{background:rgba(53,200,255,.14);color:#8DE2FF;border:1px solid rgba(53,200,255,.32)}
.b-ok{background:rgba(34,197,94,.14);color:#7BE8A6;border:1px solid rgba(34,197,94,.32)}
.b-warn{background:rgba(251,191,36,.13);color:#FFD978;border:1px solid rgba(251,191,36,.32)}
.b-err{background:rgba(248,113,113,.13);color:#FFA3A3;border:1px solid rgba(248,113,113,.32)}
.b-mut{background:rgba(169,188,210,.1);color:var(--muted);border:1px solid var(--border)}

.stat{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(53,200,255,.16),transparent 70%)}
.stat-num{font-size:27px;font-weight:800;letter-spacing:-.6px;background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="light"] .stat-num{background:linear-gradient(135deg,#0B1F3A,#1769FF);-webkit-background-clip:text;background-clip:text}
.stat-lbl{font-size:12.3px;color:var(--muted);margin-top:2px;font-weight:600}

.test-card{
  display:block;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 15px;transition:.16s;color:var(--text);position:relative;
}
.test-card:hover{border-color:rgba(53,200,255,.5);transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.28);text-decoration:none}
.test-card .tc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tc-name{font-weight:700;font-size:14.4px;line-height:1.3}
.tc-abbr{font-size:11.8px;color:var(--cyan);font-weight:700;letter-spacing:.3px;margin-top:3px}
.tc-desc{font-size:12.7px;color:var(--muted);margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.6px;color:#6F8AA8;gap:8px}

.tbl{width:100%;border-collapse:collapse;font-size:13.3px}
.tbl th{text-align:left;padding:10px 12px;background:var(--card2);color:var(--muted);font-size:11.6px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:rgba(23,105,255,.05)}
.tbl-scroll{overflow-x:auto}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:9px 14px;border-radius:10px 10px 0 0;font-size:13.2px;font-weight:600;color:var(--muted);cursor:pointer;border:0;background:none;font-family:inherit;white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);background:rgba(53,200,255,.07)}

.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{color:var(--text)}
@media(max-width:620px){.kv{grid-template-columns:1fr;gap:2px 0}.kv dd{margin-bottom:10px}}

.list{list-style:none;display:flex;flex-direction:column;gap:8px}
.list li{position:relative;padding-left:20px;font-size:13.7px;color:var(--muted);line-height:1.5}
.list li::before{content:"";position:absolute;left:4px;top:8px;width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan))}
.list li b,.list li strong{color:var(--text)}

.note{background:rgba(23,105,255,.08);border:1px solid rgba(23,105,255,.3);border-radius:12px;padding:12px 15px;font-size:13.2px;color:var(--muted);line-height:1.55}
.note.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3)}
.note.err{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3)}
.note.ok{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3)}
.note b{color:var(--text)}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px}

textarea,input[type=text],input[type=number],select{
  width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-family:inherit;font-size:13.7px;outline:none;transition:.16s;
}
textarea:focus,input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(53,200,255,.13)}
label.fld{display:block;font-size:12.4px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.2px}

.progress{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px;transition:width .4s}

/* Flashcards */
.flash{perspective:1400px;height:300px;cursor:pointer;margin-bottom:16px}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(150deg,var(--card),var(--card2));border:1px solid var(--border);
  border-radius:18px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;
}
.flash-back{transform:rotateY(180deg);align-items:flex-start;text-align:left;justify-content:center;overflow-y:auto}
.flash-q{font-size:19px;font-weight:700;line-height:1.35}
.flash-a{font-size:14.5px;color:var(--muted);line-height:1.6}
.flash-a b{color:var(--text)}

/* MCQ */
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:12px;
  border:1px solid var(--border);background:var(--card2);cursor:pointer;transition:.15s;
  font-size:14px;width:100%;text-align:left;font-family:inherit;color:var(--text);margin-bottom:9px;
}
.opt:hover:not(:disabled){border-color:#31608F;background:#14314F}
[data-theme="light"] .opt:hover:not(:disabled){background:#EAF2FC}
.opt .key{width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center;background:rgba(23,105,255,.18);color:#8FBBFF;font-weight:800;font-size:12px}
.opt.correct{border-color:rgba(34,197,94,.65);background:rgba(34,197,94,.12)}
.opt.correct .key{background:rgba(34,197,94,.3);color:#7BE8A6}
.opt.wrong{border-color:rgba(248,113,113,.6);background:rgba(248,113,113,.1)}
.opt.wrong .key{background:rgba(248,113,113,.3);color:#FFA3A3}
.opt:disabled{cursor:default}

/* Toast */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);z-index:200;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 18px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:.28s;pointer-events:none;
  max-width:90vw;
}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.ok{border-color:rgba(34,197,94,.5);color:#7BE8A6}
#toast.err{border-color:rgba(248,113,113,.5);color:#FFA3A3}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65;display:none;backdrop-filter:blur(2px)}
.overlay.show{display:block}

@media(max-width:980px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:282px;transform:translateX(-102%);transition:transform .26s ease;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex}
  .view{padding:18px 15px 70px}
  .topbar{padding:10px 14px}
  h1{font-size:21px}
  .stat-num{font-size:23px}
}
@media print{
  .sidebar,.topbar,.foot,.no-print{display:none!important}
  .app{grid-template-columns:1fr}
  body{background:#fff;color:#000}
  .card{border:1px solid #ccc;box-shadow:none;background:#fff}
  .view{padding:0}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="overlay"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn menu-btn" data-action="toggle-sidebar" aria-label="Open menu">☰</button>
      <div class="search-wrap">
        <svg class="search-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gsearch" class="search-input" type="text" placeholder="Search tests, abbreviations, diseases, symptoms…  (e.g. CBC, SGPT, jaundice)" autocomplete="off" aria-label="Global search">
        <button class="search-clear" id="gclear" style="display:none" aria-label="Clear search">×</button>
        <div class="search-pop" id="gpop"></div>
      </div>
      <button class="btn ghost" data-action="toggle-theme" title="Toggle theme" aria-label="Toggle colour theme">
        <span id="theme-ico">◐</span>
      </button>
    </header>

    <div id="view" class="view"></div>
    <footer class="foot">
      <b>M Asif Lab Technician</b> · Educational reference for MLT students · Laboratory results must always be interpreted in clinical context.
      <br>Not a diagnostic service. Content marked “awaiting medical review” requires verification against your laboratory SOP and current guidelines.
    </footer>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================================
   M ASIF LAB TECHNICIAN — Application source
   Single-file build. No external runtime dependencies.
   ========================================================================= */
"use strict";

/* ------------------------------------------------------------------ ICONS */
const IC = {
  dash:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
  flask:'<path d="M9 3h6M10 3v6L4.6 18.2A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-2.8L14 9V3"/><path d="M7.5 15h9"/>',
  layers:'<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
  heart:'<path d="M22 12h-4l-3 8-4-16-3 8H2"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chart:'<path d="M12 20V10M18 20V4M6 20v-4"/>',
  compass:'<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.4-6.4 2.1 2.1-6.4 6.4-2.1z"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2z"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
  cards:'<rect x="9" y="9" width="11" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  check:'<path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  award:'<circle cx="12" cy="8" r="6"/><path d="m8.2 13.9L7 23l5-3 5 3-1.2-9.1"/>',

const GLOSSARY = [
{t:'Analyte',d:'The specific substance being measured in a laboratory test, e.g. glucose or creatinine.'},
{t:'Reference interval',d:'The range of results expected in a healthy reference population, usually covering the central 95 %. Each laboratory establishes its own intervals.'},
{t:'Clinical decision limit',d:'A threshold used to guide clinical action (e.g. HbA1c ≥6.5 % for diabetes). It is not the same as a reference interval.'},
{t:'Critical value',d:'A result outside a defined limit that may be life-threatening and requires immediate notification of the clinician.'},
{t:'Pre-analytical error',d:'Any error occurring before analysis — patient preparation, collection, tube type, transport or storage.'},
{t:'Analytical error',d:'Error arising during measurement, such as calibration drift, reagent degradation or interference.'},
{t:'Post-analytical error',d:'Error after measurement, such as transcription mistakes, wrong units or failure to communicate a critical result.'},
{t:'Serum',d:'The fluid remaining after blood clots; obtained in a plain or clot-activator tube.'},
{t:'Plasma',d:'The fluid part of blood obtained from an anticoagulated tube after centrifugation.'},
{t:'EDTA tube',d:'Lavender-top tube containing ethylenediaminetetraacetic acid; the standard anticoagulant for full blood counts.'},
{t:'Citrate tube',d:'Light-blue-top tube containing sodium citrate; used for coagulation tests because it reversibly chelates calcium.'},
{t:'Fluoride-oxalate tube',d:'Grey-top tube that inhibits glycolysis; used for glucose and lactate measurement.'},
{t:'Haemolysis',d:'Breakdown of red cells in vitro or in vivo, releasing haemoglobin, potassium and LDH and interfering with many assays.'},
{t:'Lipaemia',d:'Excess lipid in the sample, which can interfere optically and chemically with assays.'},
{t:'Icterus',d:'Yellow discolouration from high bilirubin, which can interfere with some colorimetric assays.'},
{t:'Quality control (QC)',d:'Materials of known concentration analysed alongside patient samples to verify that the measuring system is performing correctly.'},
{t:'Calibration',d:'Establishing the relationship between the instrument signal and the concentration of the analyte using calibrators of known value.'},
{t:'External quality assessment',d:'A proficiency-testing programme in which a laboratory analyses unknown samples and compares its results with peer laboratories.'},
{t:'Sensitivity',d:'The ability of a test to identify correctly those who have the condition (true-positive rate).'},
{t:'Specificity',d:'The ability of a test to identify correctly those who do not have the condition (true-negative rate).'},
{t:'Positive predictive value',d:'The probability that a person with a positive result actually has the condition; depends on prevalence.'},
{t:'Negative predictive value',d:'The probability that a person with a negative result truly does not have the condition.'},
{t:'False positive',d:'A positive result in a person who does not have the condition.'},
{t:'False negative',d:'A negative result in a person who does have the condition.'},
{t:'Window period',d:'The interval after infection during which antibodies are not yet detectable.'},
{t:'Anaemia',d:'A reduction in haemoglobin concentration below the reference interval for age and sex.'},
{t:'Polycythaemia',d:'An increase in haemoglobin and haematocrit above the reference interval.'},
{t:'Leucocytosis',d:'An increased white cell count, often due to infection or inflammation.'},
{t:'Leucopenia',d:'A reduced white cell count.'},
{t:'Thrombocytopenia',d:'A platelet count below the reference interval, increasing bleeding risk.'},
{t:'Thrombocytosis',d:'A platelet count above the reference interval.'},
{t:'Microcytic',d:'Red cells with a low MCV (<80 fL), typically seen in iron deficiency and thalassaemia.'},
{t:'Macrocytic',d:'Red cells with a high MCV (>100 fL), seen in B12/folate deficiency, liver disease and some drugs.'},
{t:'Anisocytosis',d:'Variation in red-cell size, reflected by a raised RDW.'},
{t:'Poikilocytosis',d:'Variation in red-cell shape.'},
{t:'Hypochromia',d:'Reduced haemoglobin content within red cells, giving a low MCH/MCHC.'},
{t:'Reticulocyte',d:'A young, newly released red cell; a raised count indicates increased marrow activity.'},
{t:'Erythropoiesis',d:'The process of red blood cell production in the bone marrow.'},
{t:'Haemostasis',d:'The physiological process that stops bleeding while maintaining blood fluidity.'},
{t:'Coagulation cascade',d:'The sequence of enzymatic reactions that converts fibrinogen to fibrin, producing a clot.'},
{t:'Prothrombin time (PT)',d:'A clotting test that assesses the extrinsic and common pathways.'},
{t:'INR',d:'International Normalized Ratio — the PT standardised against a reference thromboplastin, used to monitor warfarin.'},
{t:'APTT',d:'Activated partial thromboplastin time — assesses the intrinsic and common pathways and heparin effect.'},
{t:'D-dimer',d:'A fibrin degradation product; a negative result helps exclude venous thromboembolism in low-risk patients.'},
{t:'Biosafety',d:'Practices and containment measures that protect laboratory staff, the public and the environment from biological hazards.'},

{t:'Traceability',d:'The property of a measurement result that can be related to a reference standard through an unbroken chain of calibrations.'},
{t:'Immunoassay',d:'A technique using antibodies to detect and quantify an analyte, often with an enzyme or chemiluminescent label.'},

   UTILITIES
   ========================================================================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hl(text, q){
  text = String(text==null?'':text);
  if(!q || !q.trim()) return esc(text);
  const terms = q.trim().split(/\s+/).filter(Boolean).map(x => x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!terms.length) return esc(text);
  const re = new RegExp('(' + terms.join('|') + ')', 'gi');
  let out = '', last = 0, m;
  while((m = re.exec(text)) !== null){
    out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
    if(m[0].length === 0) re.lastIndex++;
  }
  return out + esc(text.slice(last));
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}) + ' · ' +
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function ago(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60)+' min ago';
  if(s < 86400) return Math.floor(s/3600)+' h ago';
  if(s < 604800) return Math.floor(s/86400)+' d ago';
  return new Date(ts).toLocaleDateString();
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function toast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type||'');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 2600);
}
function lev(a,b){
  a=a.toLowerCase(); b=b.toLowerCase();
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = new Array(n+1), cur = new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    const t=prev; prev=cur; cur=t;
  }
  return prev[n];
}

function searchTests(q, catFilter){
  let list = catFilter ? TESTS.filter(t => t.cat === catFilter) : TESTS.slice();
  const query = (q||'').trim().toLowerCase();
  if(!query) return list;
  const terms = query.split(/\s+/).filter(Boolean);
  const scored = [];
  for(const t of list){
    let total = 0, ok = true;
    for(const term of terms){
      const nameL = t.name.toLowerCase(), abbrL = t.abbr.toLowerCase();
      let sc = 0;
      if(abbrL === term) sc = 120;
      else if(nameL === term) sc = 110;
      else if(abbrL.startsWith(term)) sc = 80;
      else if(nameL.startsWith(term)) sc = 75;
      else if(nameL.includes(term)) sc = 55;
      else if(abbrL.includes(term)) sc = 50;
      else if(t.searchBlob.includes(term)) sc = 30;
      else if(term.length >= 3 && (lev(term, abbrL) <= 1 || lev(term, nameL.split(' ')[0]) <= 1)) sc = 18;
      if(!sc){ ok = false; break; }
      total += sc;
    }
    if(ok) scored.push({t, s: total});
  }
  return scored.sort((a,b) => b.s - a.s).map(x => x.t);
}

  return { page: parts[0] || 'dashboard', param: parts[1] || '', q: new URLSearchParams(queryPart || '') };
}

  else location.hash = hash;
}

const gInput = document.getElementById('gsearch');
const gPop = document.getElementById('gpop');
const gClear = document.getElementById('gclear');
let popIndex = -1;

gInput.addEventListener('input', function(){
  const q = this.value.trim();
  gClear.style.display = q ? 'block' : 'none';
  if(!q){ gPop.classList.remove('show'); gPop.innerHTML=''; return; }
  const results = searchTests(q).slice(0, 8);
  if(!results.length){
    gPop.innerHTML = '<div class="pop-item" style="color:var(--muted)">No tests matched “' + esc(q) + '”. Try a different name or abbreviation.</div>';
  } else {
    gPop.innerHTML = results.map((t,i) =>
      '<a class="pop-item" href="#/test/' + t.id + '" data-i="' + i + '">' +
        hl(t.name, q) + ' <span class="badge b-cyan" style="margin-left:6px">' + esc(t.abbr) + '</span>' +
        '<small>' + esc(t.catName) + ' · ' + esc(t.specimen) + '</small>' +
      '</a>'
    ).join('') +
    '<a class="pop-item" href="#/search?q=' + encodeURIComponent(q) + '" style="color:var(--cyan);font-weight:700">See all results for “' + esc(q) + '” →</a>';
  }
  gPop.classList.add('show');
  popIndex = -1;
});
gInput.addEventListener('keydown', function(e){
  const items = gPop.querySelectorAll('.pop-item');
  if(e.key === 'ArrowDown'){ e.preventDefault(); popIndex = Math.min(popIndex+1, items.length-1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); popIndex = Math.max(popIndex-1, 0); }
  else if(e.key === 'Enter'){
    e.preventDefault();
    const q = this.value.trim();
    if(!q) return;
    recordSearch(q);
    if(popIndex >= 0 && items[popIndex]){ items[popIndex].click(); }
    else { const first = gPop.querySelector('.pop-item[data-i]'); if(first) first.click(); else navigate('#/search?q='+encodeURIComponent(q)); }
    gPop.classList.remove('show');
    this.blur();
    return;
  } else if(e.key === 'Escape'){ gPop.classList.remove('show'); return; }
  items.forEach((el,i) => el.classList.toggle('hl', i === popIndex));
  if(items[popIndex]) items[popIndex].scrollIntoView({block:'nearest'});
});
gClear.addEventListener('click', function(){
  gInput.value=''; gClear.style.display='none'; gPop.classList.remove('show'); gInput.focus();
});
document.addEventListener('click', function(e){
  if(!e.target.closest('.search-wrap')) gPop.classList.remove('show');
});
function recordSearch(q){
  q = (q||'').trim();
  if(!q || !S.settings.recordHistory) return;
  if(/^\d{6,}$/.test(q)) return; // never record ID-like numbers
  const existing = S.history.findIndex(h => h.q.toLowerCase() === q.toLowerCase());
  if(existing !== -1) S.history.splice(existing,1);
  S.history.unshift({q: q, ts: Date.now()});
  S.history = S.history.slice(0,60);
  save();
}
function recordView(id){
  S.recent = S.recent.filter(r => r !== id);
  S.recent.unshift(id);
  S.recent = S.recent.slice(0,12);
  save();
}

function bindDailyMcq(){
  const q = MCQ_BANK[dailyIndex(MCQ_BANK.length)];
  document.querySelectorAll('[data-daily]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.daily;
      document.querySelectorAll('[data-daily]').forEach((b,j) => {
        b.disabled = true;
        if(j === q.a) b.classList.add('correct');
        if(j === i && i !== q.a) b.classList.add('wrong');
      });
      document.getElementById('daily-exp').innerHTML =
        '<div class="note ok" style="margin-top:8px"><b>Correct answer: ' + 'ABCD'[q.a] + '. ' + esc(q.o[q.a]) + '</b><br>' + esc(q.e) + '</div>';
    });
  });
}

let libState = { cat:'', q:'', sort:'num' };

function vTests(){
  const cats = CATS;
  return `
  <div class="page-head">
    <div><h1>All Laboratory Tests</h1><p class="sub">${TESTS.length} tests across ${cats.length} clinical categories. Search by name, abbreviation, disease, symptom, specimen or organ.</p></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="row" style="margin-bottom:12px">
      <input type="text" id="lib-search" placeholder="Filter the library… e.g. SGPT, creatinine, jaundice" value="${esc(libState.q)}" style="max-width:420px">
      <select id="lib-sort" style="max-width:210px">
        <option value="num"${libState.sort==='num'?' selected':''}>Sort by list number</option>
        <option value="az"${libState.sort==='az'?' selected':''}>Sort A → Z</option>
        <option value="cat"${libState.sort==='cat'?' selected':''}>Sort by category</option>
      </select>
      <button class="btn sm" data-action="lib-reset">Reset</button>
    </div>
    <div class="row">
      <button class="chip${libState.cat===''?' active':''}" data-libcat="">All categories (${TESTS.length})</button>
      ${cats.map(c => `<button class="chip${libState.cat===c.id?' active':''}" data-libcat="${c.id}">${esc(c.name)} (${CAT_TESTS[c.id].length})</button>`).join('')}
    </div>
  </div>

  <div id="lib-results"></div>`;
}

function renderLibResults(){
  const el = document.getElementById('lib-results');
  if(!el) return;
  let list = searchTests(libState.q, libState.cat);
  if(libState.sort === 'az') list = list.slice().sort((a,b) => a.name.localeCompare(b.name));
  else if(libState.sort === 'cat') list = list.slice().sort((a,b) => a.catName.localeCompare(b.catName) || a.id - b.id);
  else list = list.slice().sort((a,b) => a.id - b.id);

  if(!list.length){
    el.innerHTML = `<div class="empty card"><h3>No tests found</h3><p class="sub">Try a different spelling, an abbreviation such as “SGPT”, or clear the filters.</p>
      <button class="btn sm" data-action="lib-reset" style="margin-top:12px">Clear filters</button></div>`;
    return;
  }
  el.innerHTML = `
    <div class="spread" style="margin-bottom:12px"><span class="sub"><b>${list.length}</b> test${list.length===1?'':'s'} shown</span>
    <span class="sub">Reference values shown are typical adult intervals — always use your laboratory's own interval.</span></div>
    <div class="grid g2">
    ${list.map(t => `
      <a class="test-card" href="#/test/${t.id}">
        <div class="tc-top">
          <div>
            <div class="tc-name">${hl(t.name, libState.q)}</div>
            <div class="tc-abbr">${hl(t.abbr, libState.q)}</div>
          </div>
          ${t.sup ? '<span class="badge b-warn">Supplementary</span>' : ''}
        </div>
        <div class="tc-desc">${hl(t.purpose, libState.q)}</div>
        <div class="tc-foot"><span>${esc(t.catName)}</span><span>#${t.id}</span></div>
      </a>`).join('')}
    </div>`;
}

function bindTestsPage(){
  const inp = document.getElementById('lib-search');
  const sel = document.getElementById('lib-sort');
  if(inp) inp.addEventListener('input', () => { libState.q = inp.value; renderLibResults(); });
  if(sel) sel.addEventListener('change', () => { libState.sort = sel.value; renderLibResults(); });
  document.querySelectorAll('[data-libcat]').forEach(b => b.addEventListener('click', () => {
    libState.cat = b.dataset.libcat;
    document.querySelectorAll('[data-libcat]').forEach(x => x.classList.toggle('active', x === b));
    renderLibResults();
  }));
  renderLibResults();
}

      </div>
      <div class="note warn"><b>Important:</b> symptoms alone do not establish a diagnosis. Results must be interpreted with the history, examination and other investigations.</div>`;
  }

  if(detailTab === 'specimen'){
    body = `
      <div class="card" style="margin-bottom:16px">
        <h3 style="margin-bottom:10px">Specimen requirements</h3>

let flashState = { cat:'', idx:0, flipped:false, known:new Set(), deck:[] };
function buildDeck(){
  const auto = TESTS.filter(t => t.abbr && t.abbr.toLowerCase() !== t.name.toLowerCase()).map(t => ({
    front:'What is ' + t.abbr + ' and what does it measure?',
    back: t.name + ' — ' + t.purpose,
    cat: t.cat
  }));
  const all = MANUAL_CARDS.concat(auto);
  return flashState.cat ? all.filter(c => c.cat === flashState.cat) : all;
}
function vFlashcards(){
  flashState.deck = buildDeck();

  const c = flashState.deck[flashState.idx];
  return `

      <div class="flash-face">

/* =========================================================================

   ========================================================================= */
let mcqState = { cat:'', level:'', idx:0, pool:[], answered:null, score:0, done:0 };
function mcqPool(){
  let p = MCQ_BANK.map((q,i) => Object.assign({}, q, {id:i}));
  if(mcqState.cat) p = p.filter(q => q.cat === mcqState.cat);
  if(mcqState.level) p = p.filter(q => q.level === mcqState.level);
  return p;
}
function vMCQ(){
  if(!mcqState.pool.length){ mcqState.pool = mcqPool(); mcqState.idx = 0; mcqState.answered = null; }
  const q = mcqState.pool[mcqState.idx];
  if(!q) return `<div class="empty card"><h3>No questions match these filters</h3><button class="btn sm" data-action="mcq-reset">Reset filters</button></div>`;
  return `
  <div class="page-head"><div><h1>MCQ Practice</h1><p class="sub">Category-specific practice with explanatory feedback.</p></div>
    <div class="row"><span class="badge b-ok">Correct: ${mcqState.score}</span><span class="badge b-mut">Answered: ${mcqState.done}</span></div>
  </div>
  <div class="row" style="margin-bottom:12px">
    <select id="mcq-cat" style="max-width:230px">
      <option value="">All categories</option>
      ${CATS.map(c => `<option value="${c.id}"${mcqState.cat===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}
    </select>
    <select id="mcq-level" style="max-width:180px">
      <option value="">All levels</option>
      <option value="easy"${mcqState.level==='easy'?' selected':''}>Easy</option>
      <option value="medium"${mcqState.level==='medium'?' selected':''}>Medium</option>
      <option value="hard"${mcqState.level==='hard'?' selected':''}>Difficult</option>
    </select>
    <button class="btn sm" data-action="mcq-reset">Reset session</button>
  </div>

  <div class="card">
    <div class="spread" style="margin-bottom:12px">
      <span class="badge b-cyan">Question ${mcqState.idx+1} of ${mcqState.pool.length}</span>
      <span class="badge b-mut">${esc(q.level)} · ${esc((CATMAP[q.cat]||{name:'General'}).name)}</span>
    </div>
    <p style="font-weight:650;font-size:15.5px;margin-bottom:14px">${esc(q.q)}</p>
    ${q.o.map((o,i) => {
      let cls = '';
      if(mcqState.answered !== null){
        if(i === q.a) cls = ' correct';
        else if(i === mcqState.answered) cls = ' wrong';
      }
      return `<button class="opt${cls}" data-mcq="${i}" ${mcqState.answered!==null?'disabled':''}><span class="key">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
    }).join('')}
    ${mcqState.answered !== null ? `<div class="note ${mcqState.answered===q.a?'ok':'err'}" style="margin-top:10px">
      <b>${mcqState.answered===q.a?'Correct.':'Incorrect.'} Answer: ${'ABCD'[q.a]} — ${esc(q.o[q.a])}</b><br>${esc(q.e)}</div>
      <div class="row" style="margin-top:12px;justify-content:flex-end">
        <button class="btn primary" data-action="mcq-next">${mcqState.idx+1 >= mcqState.pool.length ? 'Restart set' : 'Next question →'}</button>
      </div>` : ''}
  </div>`;
}

let quizState = null;
let quizTimer = null;

function vQuiz(){
  if(!quizState){
    return `
    <div class="page-head"><div><h1>Quiz and Mock Exams</h1><p class="sub">Configure a practice exam from the question bank.</p></div></div>
    <div class="card" style="max-width:640px">
      <h3 style="margin-bottom:14px">Exam settings</h3>
      <label class="fld">Number of questions</label>
      <select id="quiz-count">
        <option value="10">10 questions</option>
        <option value="20" selected>20 questions</option>
        <option value="30">30 questions</option>
        <option value="40">40 questions</option>
        <option value="50">50 questions</option>
      </select>
      <label class="fld" style="margin-top:12px">Topic</label>
      <select id="quiz-cat">
        <option value="">All topics</option>
        ${CATS.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}
      </select>
      <label class="fld" style="margin-top:12px">Timer</label>
      <select id="quiz-timer">
        <option value="0">No timer</option>
        <option value="1">Timed (1 minute per question)</option>
      </select>
      <div class="row" style="margin-top:18px">
        <button class="btn primary" data-action="quiz-start">Start exam</button>
      </div>
      <div class="note" style="margin-top:16px">Questions are drawn from this site's practice question bank. They are educational and are not endorsed by any examination board or accreditation body.</div>
    </div>
    ${S.quizResults.length ? `<div class="card" style="margin-top:18px"><h3 style="margin-bottom:10px">Previous results</h3>
      <div class="tbl-scroll"><table class="tbl"><thead><tr><th>Date</th><th>Score</th><th>Questions</th></tr></thead>
      <tbody>${S.quizResults.slice().reverse().slice(0,10).map(r => `<tr><td class="sub">${esc(fmtDate(r.ts))}</td><td><b>${r.score}/${r.total}</b> (${Math.round(r.score/r.total*100)}%)</td><td>${r.total}</td></tr>`).join('')}</tbody></table></div>
      <button class="btn sm danger" style="margin-top:12px" data-action="quiz-clear">Clear saved results</button>
    </div>` : ''}`;
  }

  const qs = quizState.questions;
  const answeredCount = quizState.answers.filter(a => a !== null).length;
  if(quizState.submitted){
    const score = qs.reduce((acc,q,i) => acc + (quizState.answers[i] === q.a ? 1 : 0), 0);
    const pct = Math.round(score/qs.length*100);
    return `
    <div class="page-head"><div><h1>Exam results</h1><p class="sub">${score} of ${qs.length} correct — ${pct}%</p></div>
      <button class="btn primary" data-action="quiz-new">New exam</button></div>
    <div class="card" style="margin-bottom:18px">
      <div class="progress" style="height:12px"><i style="width:${pct}%"></i></div>
      <p class="sub" style="margin-top:10px">${pct >= 80 ? 'Excellent — strong command of the material.' : pct >= 60 ? 'Good attempt — review the incorrect answers below.' : 'Keep practising — review each explanation carefully.'}</p>
    </div>
    ${qs.map((q,i) => {
      const given = quizState.answers[i];
      const ok = given === q.a;
      return `<div class="card" style="margin-bottom:12px">
        <div class="spread" style="margin-bottom:8px">
          <span class="badge ${ok?'b-ok':'b-err'}">Q${i+1} · ${ok?'Correct':'Incorrect'}</span>
          <span class="badge b-mut">${esc((CATMAP[q.cat]||{name:'General'}).name)}</span>
        </div>
        <p style="font-weight:600;margin-bottom:10px">${esc(q.q)}</p>
        ${q.o.map((o,j) => `<div class="opt ${j===q.a?'correct':(j===given?'wrong':'')}" style="cursor:default"><span class="key">${'ABCD'[j]}</span><span>${esc(o)}</span></div>`).join('')}
        <div class="note" style="margin-top:8px">${esc(q.e)}</div>
      </div>`;
    }).join('')}`;
  }

  return `
  <div class="page-head">
    <div><h1>Mock exam in progress</h1><p class="sub">${answeredCount} of ${qs.length} answered${quizState.timer > 0 ? ' · Time remaining: <b id="quiz-clock">' + fmtClock(quizState.remaining) + '</b>' : ''}</p></div>
    <button class="btn danger" data-action="quiz-submit">Submit exam</button>
  </div>
  <div class="progress" style="margin-bottom:16px"><i style="width:${Math.round(answeredCount/qs.length*100)}%"></i></div>
  ${qs.map((q,i) => `
    <div class="card" style="margin-bottom:14px">
      <div class="spread" style="margin-bottom:10px">
        <span class="badge b-cyan">Question ${i+1}</span>
        <span class="badge b-mut">${esc((CATMAP[q.cat]||{name:'General'}).name)}</span>
      </div>
      <p style="font-weight:600;margin-bottom:12px">${esc(q.q)}</p>
      ${q.o.map((o,j) => `<button class="opt${quizState.answers[i]===j?' ':' '+''}${quizState.answers[i]===j?'correct':''}" data-quiz="${i}-${j}"><span class="key">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}
    </div>`).join('')}
  <div class="row" style="justify-content:flex-end"><button class="btn primary" data-action="quiz-submit">Submit exam</button></div>`;
}
function fmtClock(sec){
  const m = Math.floor(sec/60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function startQuizTimer(){
  clearInterval(quizTimer);
  if(!quizState || quizState.timer <= 0) return;
  quizTimer = setInterval(() => {
    if(!quizState || quizState.submitted){ clearInterval(quizTimer); return; }
    quizState.remaining--;
    const el = document.getElementById('quiz-clock');
    if(el) el.textContent = fmtClock(Math.max(0, quizState.remaining));
    if(quizState.remaining <= 0){ clearInterval(quizTimer); submitQuiz(true); }
  }, 1000);
}
function submitQuiz(auto){
  if(!quizState || quizState.submitted) return;
  if(!auto){
    const answered = quizState.answers.filter(a => a !== null).length;
    if(answered < quizState.questions.length && !confirm('You have answered ' + answered + ' of ' + quizState.questions.length + ' questions. Submit anyway?')) return;
  }
  clearInterval(quizTimer);
  quizState.submitted = true;
  const score = quizState.questions.reduce((acc,q,i) => acc + (quizState.answers[i] === q.a ? 1 : 0), 0);
  S.quizResults.push({ts: Date.now(), score: score, total: quizState.questions.length});
  S.quizResults = S.quizResults.slice(-50);
  save();
  render();
  toast('Exam submitted — ' + score + '/' + quizState.questions.length, 'ok');
}

/* =========================================================================
   ACTIONS
   ========================================================================= */
function toggleFav(id){
  id = +id;
  const i = S.favorites.indexOf(id);
  if(i === -1){ S.favorites.push(id); toast('Added to favorites', 'ok'); }
  else { S.favorites.splice(i,1); toast('Removed from favorites'); }
  save(); render();
}
function toggleStudied(id){
  id = +id;
  const i = S.studied.indexOf(id);
  if(i === -1){ S.studied.push(id); toast('Marked as studied', 'ok'); }
  else { S.studied.splice(i,1); toast('Removed from studied list'); }
  save(); render();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', S.theme);
  const ico = document.getElementById('theme-ico');
  if(ico) ico.textContent = S.theme === 'dark' ? '◐' : '◑';
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  if(a === 'toggle-theme'){ S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); render(); return; }
  if(a === 'toggle-sidebar'){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); return; }
  if(a === 'fav'){ toggleFav(el.dataset.id); return; }
  if(a === 'studied'){ toggleStudied(el.dataset.id); return; }
  if(a === 'note-for'){ openNoteEditor(null, +el.dataset.id); return; }
  if(a === 'note-new'){ openNoteEditor(null, null); return; }
  if(a === 'note-edit'){ openNoteEditor(el.dataset.id, null); return; }
  if(a === 'note-cancel'){ const m = document.getElementById('note-modal'); if(m) m.remove(); return; }
  if(a === 'note-save'){
    const title = document.getElementById('note-title').value.trim();
    const body = document.getElementById('note-body').value.trim();
    if(!title && !body){ toast('Write something before saving', 'err'); return; }
    const id = el.dataset.id;
    if(id){
      const n = S.notes.find(x => x.id === id);
      if(n){ n.title = title || 'Untitled note'; n.body = body; n.updated = Date.now(); }
      toast('Note updated', 'ok');
    } else {
      S.notes.push({id: uid(), title: title || 'Untitled note', body: body, testId: el.dataset.test ? +el.dataset.test : null, updated: Date.now()});
      toast('Note saved', 'ok');
    }
    save();
    const m = document.getElementById('note-modal'); if(m) m.remove();
    render();
    return;
  }
  if(a === 'note-del'){
    if(!confirm('Delete this note permanently?')) return;
    S.notes = S.notes.filter(n => n.id !== el.dataset.id); save(); render(); toast('Note deleted');
    return;
  }
  if(a === 'copy'){
    const t = TMAP[+el.dataset.id];
    const txt = t.name + ' (' + t.abbr + ')\nCategory: ' + t.catName + '\nSpecimen: ' + t.specimen +
      '\nTypical interval: ' + (t.ref || 'refer to laboratory') + ' ' + (t.unit||'') +
      '\n\n' + t.purpose + '\n\nSource: M Asif Lab Technician (educational reference — verify against your laboratory SOP).';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(() => toast('Summary copied', 'ok')).catch(() => toast('Copy failed', 'err'));
    } else { toast('Clipboard not available in this browser', 'err'); }
    return;
  }
  if(a === 'print'){ window.print(); return; }
  if(a === 'share'){
    const t = TMAP[+el.dataset.id];
    const url = location.origin + location.pathname + '#/test/' + t.id;
    if(navigator.share){
      navigator.share({title: t.name + ' — M Asif Lab Technician', text: t.purpose, url: url}).catch(()=>{});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(() => toast('Link copied to clipboard', 'ok')).catch(()=>toast('Could not copy link','err'));
    } else { toast('Sharing not supported in this browser', 'err'); }
    return;
  }
  if(a === 'clear-history'){
    if(!confirm('Clear all search history? This cannot be undone.')) return;
    S.history = []; save(); render(); toast('Search history cleared');
    return;
  }
  if(a === 'del-history'){
    S.history.splice(+el.dataset.i, 1); save(); render(); toast('Entry removed');
    return;
  }
  if(a === 'rerun'){ navigate('#/search?q=' + encodeURIComponent(el.dataset.q)); return; }
  if(a === 'toggle-history'){
    S.settings.recordHistory = !S.settings.recordHistory; save(); render();
    toast('Search history recording ' + (S.settings.recordHistory ? 'enabled' : 'disabled'));
    return;
  }
  if(a === 'reset-progress'){
    if(!confirm('Reset ALL local data — favorites, notes, studied list, search history and quiz results? This cannot be undone.')) return;
    S = JSON.parse(JSON.stringify(DEFAULT_STORE));
    save(); applyTheme(); render(); toast('All progress reset');
    return;
  }
  if(a === 'export-data'){
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = 'masif-mlt-data.json';
    document.body.appendChild(link); link.click(); link.remove();
    URL.revokeObjectURL(url);
    toast('Data exported', 'ok');
    return;
  }
  if(a === 'lib-reset'){ libState = {cat:'', q:'', sort:'num'}; render(); return; }
  if(a === 'range-reset'){ rangeState = {q:'', cat:''}; render(); return; }

  /* Flashcards */
  if(a === 'flash-flip'){ flashState.flipped = !flashState.flipped; render(); return; }
  if(a === 'flash-next'){ flashState.idx = (flashState.idx + 1) % flashState.deck.length; flashState.flipped = false; render(); return; }
  if(a === 'flash-prev'){ flashState.idx = (flashState.idx - 1 + flashState.deck.length) % flashState.deck.length; flashState.flipped = false; render(); return; }
  if(a === 'flash-shuffle'){
    flashState.deck = flashState.deck.slice().sort(() => Math.random() - 0.5);
    flashState.idx = 0; flashState.flipped = false; render(); toast('Deck shuffled'); return;
  }
  if(a === 'flash-known'){ flashState.known.add(flashState.idx); flashState.idx = (flashState.idx+1) % flashState.deck.length; flashState.flipped = false; render(); return; }
  if(a === 'flash-revise'){ flashState.idx = (flashState.idx+1) % flashState.deck.length; flashState.flipped = false; render(); return; }
  if(a === 'flash-reset'){ flashState.known.clear(); toast('Known-card list reset'); render(); return; }

  /* MCQ */
  if(a === 'mcq-reset'){ mcqState = {cat:'', level:'', idx:0, pool:[], answered:null, score:0, done:0}; render(); return; }
  if(a === 'mcq-next'){
    if(mcqState.idx + 1 >= mcqState.pool.length){ mcqState.idx = 0; mcqState.answered = null; mcqState.score = 0; mcqState.done = 0; mcqState.pool = mcqPool(); }
    else { mcqState.idx++; mcqState.answered = null; }
    render(); return;
  }

  /* Quiz */
  if(a === 'quiz-start'){
    const count = +document.getElementById('quiz-count').value;
    const cat = document.getElementById('quiz-cat').value;
    const timed = document.getElementById('quiz-timer').value === '1';
    let pool = MCQ_BANK.map((q,i) => Object.assign({}, q, {id:i}));
    if(cat) pool = pool.filter(q => q.cat === cat);
    if(!pool.length){ toast('No questions available for that topic', 'err'); return; }
    pool = pool.slice().sort(() => Math.random() - 0.5).slice(0, Math.min(count, pool.length));
    quizState = {
      questions: pool, answers: pool.map(() => null), submitted: false,
      timer: timed ? pool.length * 60 : 0, remaining: timed ? pool.length * 60 : 0
    };
    render(); startQuizTimer(); return;
  }
  if(a === 'quiz-submit'){ submitQuiz(false); return; }
  if(a === 'quiz-new'){ clearInterval(quizTimer); quizState = null; render(); return; }
  if(a === 'quiz-clear'){ if(!confirm('Clear saved exam results?')) return; S.quizResults = []; save(); render(); toast('Results cleared'); return; }
});

/* quiz answer + mcq answer delegation */
document.addEventListener('click', function(e){
  const qb = e.target.closest('[data-quiz]');
  if(qb && quizState && !quizState.submitted){
    const [qi, oi] = qb.dataset.quiz.split('-').map(Number);
    quizState.answers[qi] = oi;
    render();
    return;
  }
  const mb = e.target.closest('[data-mcq]');
  if(mb && mcqState.answered === null){
    const oi = +mb.dataset.mcq;
    const q = mcqState.pool[mcqState.idx];
    mcqState.answered = oi;
    mcqState.done++;
    if(oi === q.a) mcqState.score++;
    S.mcqResults.push({ts: Date.now(), correct: oi === q.a, cat: q.cat});
    S.mcqResults = S.mcqResults.slice(-200);
    save();
    render();
    return;
  }
});

});

/* =========================================================================
   RENDER
   ========================================================================= */
function render(){
  const {page, param, q} = parseRoute();
  renderSidebar();
  const view = document.getElementById('view');
  let html = '';

  switch(page){
    case 'dashboard': html = vDashboard(); break;
    case 'tests': html = vTests(); break;
    case 'test': html = vTest(param); break;
    case 'categories': html = vCategories(); break;
    case 'diseases': html = vDiseases(); break;
    case 'disease': html = vDisease(param); break;
    case 'procedures': html = vProcedures(); break;
    case 'ranges': html = vRanges(); break;
    case 'diagnostic': html = vDiagnostic(); break;
    case 'search': {
      const term = q.get('q') || '';
      if(term) recordSearch(term);
      html = vSearch(term);
      break;
    }
    case 'history': html = vHistory(); break;
    case 'bookmarks': html = vBookmarks(); break;
    case 'notes': html = vNotes(); break;
    case 'flashcards': html = vFlashcards(); break;
    case 'mcq': html = vMCQ(); break;
    case 'quiz': html = vQuiz(); break;
    case 'glossary': html = vGlossary(); break;
    case 'about': html = vAbout(); break;
    case 'settings': html = vSettings(); break;
    default: html = vDashboard();
  }
  view.innerHTML = html;
  document.title = (page === 'dashboard' ? 'Dashboard' : (page.charAt(0).toUpperCase() + page.slice(1))) +
                   ' — M Asif Lab Technician';

  /* page-specific bindings */
  if(page === 'dashboard') bindDailyMcq();
  if(page === 'tests') bindTestsPage();
  if(page === 'test') bindTestPage();
  if(page === 'ranges'){ 
    const rq = document.getElementById('range-q');
    if(rq) rq.addEventListener('input', () => { rangeState.q = rq.value; renderRanges(); });
    document.querySelectorAll('[data-rangecat]').forEach(b => b.addEventListener('click', () => {
      rangeState.cat = b.dataset.rangecat;
      document.querySelectorAll('[data-rangecat]').forEach(x => x.classList.toggle('active', x === b));
      renderRanges();
    }));
    renderRanges();
  }
  if(page === 'glossary') bindGlossary();
  if(page === 'notes'){
    const ns = document.getElementById('note-search');
    if(ns) ns.addEventListener('input', () => {
      const q2 = ns.value.toLowerCase().trim();
      document.querySelectorAll('[data-note-text]').forEach(el => {
        el.style.display = !q2 || el.dataset.noteText.includes(q2) ? '' : 'none';
      });
    });
  }
  if(page === 'mcq'){
    const c = document.getElementById('mcq-cat');
    const l = document.getElementById('mcq-level');
    if(c) c.addEventListener('change', () => { mcqState.cat = c.value; mcqState.pool = mcqPool(); mcqState.idx = 0; mcqState.answered = null; render(); });
    if(l) l.addEventListener('change', () => { mcqState.level = l.value; mcqState.pool = mcqPool(); mcqState.idx = 0; mcqState.answered = null; render(); });
  }
  if(page === 'flashcards'){
    document.querySelectorAll('[data-flashcat]').forEach(b => b.addEventListener('click', () => {
      flashState.cat = b.dataset.flashcat; flashState.idx = 0; flashState.flipped = false; render();
    }));
  }
  /* close mobile menu on navigation */
  if(window.innerWidth <= 980){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }
}

window.addEventListener('hashchange', () => { render(); window.scrollTo({top:0, behavior:'instant'}); });

/* Boot */
applyTheme();
if(!location.hash) location.hash = '#/dashboard';
render();
</script>
</body>
</html>
